name: MusicSearch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  MusicSearch:
    type: application
    platform: iOS
    sources: [MusicSearchApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicsearch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Music
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
